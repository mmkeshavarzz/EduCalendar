<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Konkur Center 1406 Countdown</title>
    <!-- 
        ========================================================
        👨‍💻 DEVELOPED FOR MAHDI (RANK 1 KONKUR 1406)
        🎨 DESIGN: Glassmorphism + Neumorphism for WARRIORS
        ========================================================
    -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        /* ================= VARIABLES & THEMES ================= */
        :root {
            --bg-color: #f8f9fa;
            --glass-bg: rgba(255, 255, 255, 0.4);
            --glass-border: rgba(255, 255, 255, 0.6);
            --neu-shadow-1: 8px 8px 16px #e0e5ec;
            --neu-shadow-2: -8px -8px 16px #ffffff;
            --text-main: #2d3436;
            --text-muted: #636e72;
            --accent-1: #ff7675; /* Red for Konkur */
            --accent-2: #0984e3; /* Blue for Finals */
        }

        [data-theme="dark"] {
            --bg-color: #0f172a; 
            --glass-bg: rgba(30, 41, 59, 0.5);
            --glass-border: rgba(255, 255, 255, 0.1);
            --neu-shadow-1: 10px 10px 20px #0a0f1c;
            --neu-shadow-2: -10px -10px 20px #141f38;
            --text-main: #f1f5f9;
            --text-muted: #94a3b8;
            --accent-1: #ff7675;
            --accent-2: #74b9ff;
        }

        /* ================= RESET & BASE ================= */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            transition: all 0.3s ease;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
        }

        /* ================= MAIN CONTAINER ================= */
        .bento-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            width: 100%;
            max-width: 600px;
            padding: 30px;
            border-radius: 30px;
            background: var(--bg-color);
            box-shadow: var(--neu-shadow-1), var(--neu-shadow-2);
            position: relative;
            z-index: 10;
        }

        /* Today Badge */
        .today-badge {
            text-align: center;
            padding: 15px;
            border-radius: 20px;
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--glass-border);
            font-size: 1.2rem;
            font-weight: bold;
            box-shadow: inset 4px 4px 10px rgba(0,0,0,0.02);
        }

        /* Event Box */
        .event-box {
            display: flex;
            flex-direction: column;
            padding: 25px;
            border-radius: 25px;
            background: var(--glass-bg);
            backdrop-filter: blur(5px);
            border: 1px solid var(--glass-border);
            box-shadow: var(--neu-shadow-1);
        }

        .event-box.konkur { border-right: 5px solid var(--accent-1); }
        .event-box.finals { border-right: 5px solid var(--accent-2); }

        .event-title {
            font-size: 1.3rem;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .event-days {
            font-size: 2.2rem;
            font-weight: bold;
            color: var(--text-main);
            margin-bottom: 5px;
        }

        .event-details {
            font-size: 0.95rem;
            color: var(--text-muted);
            line-height: 1.6;
        }

        /* ================= CONTROLS ================= */
        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 10px;
        }

        .btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: none;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-color);
            box-shadow: var(--neu-shadow-1), var(--neu-shadow-2);
            fill: var(--text-main);
        }

        .btn:active {
            box-shadow: inset 4px 4px 10px rgba(0,0,0,0.1), inset -4px -4px 10px rgba(255,255,255,0.5);
        }

        .btn svg { width: 24px; height: 24px; }
        
        /* ================= RESPONSIVE ================= */
        @media (max-width: 480px) {
            .bento-container { padding: 15px; gap: 15px; border-radius: 20px; }
            .event-days { font-size: 1.8rem; }
        }
    </style>
</head>
<body>

    <div class="bento-container" id="export-target">
        
        <!-- Today -->
        <div class="today-badge" id="today-text">
            امروز: در حال محاسبه... ⏳
        </div>

        <!-- Konkur Event -->
        <div class="event-box konkur">
            <div class="event-title">🏆 تا کنکور ۱۴۰۶ (۱۱ تیر ۱۴۰۶):</div>
            <div class="event-days" id="konkur-days">-- روز</div>
            <div class="event-details" id="konkur-details">
                (معادل -- هفته و -- روز / یا حدود -- ماه و -- روز)
            </div>
        </div>
        
        <!-- Finals Event -->
        <div class="event-box finals">
            <div class="event-title">📝 تا امتحانات نهایی (۲۶ اردیبهشت ۱۴۰۶):</div>
            <div class="event-days" id="finals-days">-- روز</div>
            <div class="event-details" id="finals-details">
                (معادل -- هفته و -- روز / یا حدود -- ماه و -- روز)
            </div>
        </div>

        <div class="controls" data-html2canvas-ignore>
            <!-- Dark Mode Toggle -->
            <button class="btn" id="theme-toggle" title="تغییر تم">
                <svg viewBox="0 0 24 24"><path d="M12 21c-4.962 0-9-4.038-9-9s4.038-9 9-9 9 4.038 9 9-4.038 9-9 9zm0-16c-3.859 0-7 3.141-7 7s3.141 7 7 7 7-3.141 7-7-3.141-7-7-7zm0 12c-2.757 0-5-2.243-5-5s2.243-5 5-5 5 2.243 5 5-2.243 5-5 5z"/></svg>
            </button>
            <!-- Export PNG -->
            <button class="btn" id="export-btn" title="خروجی عکس">
                <svg viewBox="0 0 24 24"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg>
            </button>
        </div>
    </div>

    <script>
        // ================= DATE LOGIC =================
        // Convert numbers to Persian
        function toPersianNum(num) {
            const farsiDigits = ['۰', '۱', '۲', '۳', '۴', '۵', '۶', '۷', '۸', '۹'];
            return num.toString().replace(/\d/g, x => farsiDigits[x]);
        }

        // Target Dates in Gregorian (Approximate matching the Persian dates)
        // 11 Tir 1406 = July 2, 2027
        const konkurDate = new Date("July 2, 2027 00:00:00").getTime();
        // 26 Ordibehesht 1406 = May 16, 2027
        const finalsDate = new Date("May 16, 2027 00:00:00").getTime();

        function calculateTime(targetTime) {
            const now = new Date().getTime();
            const diff = targetTime - now;
            
            if (diff < 0) return { days: 0, weeks: 0, weekDays: 0, months: 0, monthDays: 0 };

            const totalDays = Math.ceil(diff / (1000 * 60 * 60 * 24));
            const weeks = Math.floor(totalDays / 7);
            const weekDays = totalDays % 7;
            const months = Math.floor(totalDays / 30); // Approximate month
            const monthDays = totalDays % 30;

            return { totalDays, weeks, weekDays, months, monthDays };
        }

        function updateUI() {
            // Update Today's Date in Persian
            const options = { year: 'numeric', month: 'long', day: 'numeric', numberingSystem: 'arabext' };
            const todayStr = new Intl.DateTimeFormat('fa-IR', options).format(new Date());
            // Fix Arabic numbers to Persian style visually if needed, though 'arabext' usually handles it.
            document.getElementById('today-text').innerText = `امروز: ${todayStr}`;

            // Konkur Calc
            const k = calculateTime(konkurDate);
            document.getElementById('konkur-days').innerText = `${toPersianNum(k.totalDays)} روز`;
            document.getElementById('konkur-details').innerText = `(معادل ${toPersianNum(k.weeks)} هفته و ${toPersianNum(k.weekDays)} روز / یا حدود ${toPersianNum(k.months)} ماه و ${toPersianNum(k.monthDays)} روز)`;

            // Finals Calc
            const f = calculateTime(finalsDate);
            document.getElementById('finals-days').innerText = `${toPersianNum(f.totalDays)} روز`;
            document.getElementById('finals-details').innerText = `(معادل ${toPersianNum(f.weeks)} هفته و ${toPersianNum(f.weekDays)} روز / یا حدود ${toPersianNum(f.months)} ماه و ${toPersianNum(f.monthDays)} روز)`;
        }

        // Run once
        updateUI();
        // Update daily (every 12 hours is enough for days)
        setInterval(updateUI, 1000 * 60 * 60 * 12);

        // ================= THEME & EXPORT =================
        const themeToggleBtn = document.getElementById('theme-toggle');
        if(localStorage.getItem('konkurTheme') === 'dark') document.body.setAttribute('data-theme', 'dark');

        themeToggleBtn.addEventListener('click', () => {
            if(document.body.getAttribute('data-theme') === 'dark') {
                document.body.removeAttribute('data-theme');
                localStorage.setItem('konkurTheme', 'light');
            } else {
                document.body.setAttribute('data-theme', 'dark');
                localStorage.setItem('konkurTheme', 'dark');
            }
        });

        document.getElementById('export-btn').addEventListener('click', () => {
            const element = document.getElementById('export-target');
            element.style.borderRadius = "0px"; 
            html2canvas(element, {
                scale: 3, 
                backgroundColor: getComputedStyle(document.body).getPropertyValue('--bg-color'),
                useCORS: true
            }).then(canvas => {
                element.style.borderRadius = "30px"; 
                let link = document.createElement('a');
                link.download = 'Konkur_Countdown.png';
                link.href = canvas.toDataURL("image/png");
                link.click();
            });
        });
    </script>
</body>
</html>
